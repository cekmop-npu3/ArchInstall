name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iso_build:
    name: Build ISO
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Restore ISO cache
        id: iso-cache
        uses: actions/cache@v6
        with:
          path: arch_linux.iso
          key: arch-linux-iso-${{ runner.arch }}-v1

      - name: Build Arch Linux ISO
        if: steps.iso-cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm --privileged \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            archlinux:latest \
            bash -euxo pipefail -c '
              pacman -Syu --noconfirm archiso
              mkarchiso \
                -r \
                -m iso \
                -p git \
                -o /workspace/out \
                /usr/share/archiso/configs/releng

              mv /workspace/out/*.iso /workspace/arch_linux.iso
            '

      - name: Validate release asset size and create checksum
        run: |
          set -euo pipefail
          max_release_asset_bytes=$((2 * 1024 * 1024 * 1024 - 1))
          iso_size=$(stat --format=%s arch_linux.iso)
          if (( iso_size > max_release_asset_bytes )); then
            echo "arch_linux.iso is ${iso_size} bytes; GitHub release assets must be smaller than 2 GiB." >&2
            exit 1
          fi
          sha256sum arch_linux.iso > arch_linux.iso.sha256

      - name: Upload ISO build artifact
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: arch-linux-iso
          path: |
            arch_linux.iso
            arch_linux.iso.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  ventoy_injection:
    name: Ventoy injection
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate ventoy injection archive
        run: |
          git clone --depth 1 https://github.com/ventoy/LiveInjection.git
          cp -a ventoy/sysroot/. LiveInjection/sysroot/
          (
            cd LiveInjection
            sh pack.sh
          )

      - name: Stage Ventoy release files
        run: |
          mkdir release-files
          cp ventoy/ventoy.json release-files/ventoy.json
          cp LiveInjection/live_injection.tar.gz release-files/live_injection.tar.gz

      - name: Upload ventoy files
        uses: actions/upload-artifact@v7
        with:
          name: ventoy-files
          path: release-files/*
          if-no-files-found: error

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs:
      - iso_build
      - ventoy_injection
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/arch_linux.iso
            release-assets/arch_linux.iso.sha256
            release-assets/ventoy.json
            release-assets/live_injection.tar.gz
